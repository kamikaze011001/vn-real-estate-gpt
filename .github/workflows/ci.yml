name: Checks and deployment

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-crawl.txt
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:crawl
      - name: Check runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Database and hosted state
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-crawl.txt
      - run: npm ci
      - run: npm run build
      - run: npm run db:start > /tmp/supabase-start.log 2>&1
      - run: npm exec -- supabase db reset --local --yes
      - run: npm run db:test
      - run: npm run test:hosted
      - name: Stop this job's local database
        if: always()
        run: npm exec -- supabase stop --no-backup

  production:
    name: Deploy production
    needs: [app, database]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify deployment configuration
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD APP_BASE_URL; do
            if [[ -z "${!name}" ]]; then echo "Missing deployment setting: $name"; exit 1; fi
          done
      - name: Avoid deploying an outdated main revision
        shell: bash
        run: |
          latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "main changed while checks ran; the newer revision owns deployment."
            exit 1
          fi
      - name: Apply additive database migrations before application deployment
        run: |
          node scripts/check-supabase-access.mjs
          npm exec -- supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npm exec -- supabase db push --linked --yes
      - name: Pull Vercel production configuration
        run: npm exec -- vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build the Vercel deployment
        run: npm exec -- vercel build --prod --token="$VERCEL_TOKEN"
      - name: Verify landing and embedded resources in the production artifact
        run: node scripts/check-vercel-output.mjs
      - name: Deploy the checked artifact
        shell: bash
        run: |
          npm exec -- vercel deploy --prebuilt --prod --json --token="$VERCEL_TOKEN" > /tmp/vercel-deployment.json
      - name: Verify health, MCP, resources and persisted selection comparison
        env:
          EXPECT_HOSTED: '1'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run deploy:smoke
