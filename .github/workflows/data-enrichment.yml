name: Daily Hanoi data enrichment
on:
  schedule:
    # 06:17 Asia/Ho_Chi_Minh; schedules may be delayed by GitHub.
    - cron: '17 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hanoi-data-enrichment
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.HANOI_DAILY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned crawler dependencies
        run: python -m pip install -r requirements-crawl.txt
      - name: Collect bounded candidates into the private review inbox
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run pipeline -- collect --apply
      - name: Report run freshness
        if: always()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run pipeline -- status
